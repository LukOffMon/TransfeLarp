  :root{
    --ink:#1C1B18; --paper:#F1EAD9;
    --t-bg1:#0E1E3D; --t-bg2:#1B3260; --t-text:#F4EFE3; --t-sub:#B9C4DE;
    --t-accent:#D2A83C; --t-accent-text:#1C1707;
    --serif:'Playfair Display',Georgia,'Times New Roman',serif;
    --garamond:'EB Garamond',Georgia,serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    min-height:100vh;
    background-color:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(28,27,24,.06) 1px, transparent 0);
    background-size:18px 18px;
    display:flex;align-items:center;justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    font-family:var(--garamond);
  }

  /* Marco de teléfono */
  .phone-shell{
    width:100%;max-width:300px;
    background:#0c0c0c;border-radius:2.6rem;padding:14px;
    box-shadow:0 20px 45px -18px rgba(0,0,0,.55), inset 0 0 0 2px #2b2b2b;
  }
  .notch-wrap{display:flex;justify-content:center;}
  .phone-notch{width:90px;height:22px;border-radius:0 0 14px 14px;background:#0c0c0c;}
  .phone-screen{
    background:#000;border-radius:2rem;overflow:hidden;
    padding:30px 12px 12px;margin-top:-22px;
  }

  /* Tarjeta — Profesional Ejecutivo */
  #card{
    position:relative;overflow:hidden;
    background:
      radial-gradient(ellipse 120% 90% at 15% 0%, rgba(210,168,60,.10), transparent 55%),
      linear-gradient(160deg,var(--t-bg1) 0%,var(--t-bg2) 100%);
    color:var(--t-text);border-radius:6px;
    padding:22px 22px 20px;min-height:420px;display:flex;flex-direction:column;
    box-shadow:inset 0 0 0 1px rgba(210,168,60,.28);
  }
  .icons{position:absolute;inset:0;z-index:0;opacity:.10;pointer-events:none;color:var(--t-accent);}
  .icons svg{position:absolute;}
  #card > *:not(.icons){position:relative;z-index:1;}

  .sub{color:var(--t-sub);}
  .row{display:flex;justify-content:space-between;align-items:flex-start;}
  .kicker{
    font-family:var(--garamond);font-weight:600;font-size:10.5px;line-height:16px;
    text-transform:uppercase;letter-spacing:.14em;white-space:nowrap;
  }
  .biz{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.25;margin-top:6px;letter-spacing:.01em;}
  .qr{flex:none;opacity:.75;margin-top:2px;}
  .owner{font-family:var(--garamond);font-weight:600;font-size:15px;line-height:20px;margin-top:6px;}

  .block{margin-top:22px;}
  .block.acc{margin-top:18px;}
  .label{font-family:var(--garamond);font-weight:600;font-size:10.5px;line-height:16px;text-transform:uppercase;letter-spacing:.18em;}
  .value{font-family:var(--mono);letter-spacing:.02em;margin-top:6px;}
  .value.big{font-size:16px;line-height:24px;}
  .value.small{font-size:14px;line-height:20px;}

  .btn{
    margin-top:10px;display:inline-flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#E4BE5C,var(--t-accent));color:var(--t-accent-text);
    font:600 12px/16px var(--garamond);letter-spacing:.03em;
    border:0;border-radius:999px;padding:8px 16px;cursor:pointer;
    box-shadow:0 4px 10px -4px rgba(0,0,0,.5);
    transition:filter .15s ease,transform .1s ease;
  }

  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important;}}
</style>
</head>

<script>
(function(){
  "use strict";
  var toast = document.getElementById('toast'), timer;
  var digits = function(id){ var t = document.getElementById(id).textContent; return /\d/.test(t) ? t.replace(/\D/g,'') : ''; };

  function show(msg){
    toast.textContent = msg; toast.classList.add('show');
    clearTimeout(timer); timer = setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }
  function fallback(text, ok){
    var h = document.createElement('textarea');
    h.value = text; h.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(h); h.select();
    try{ document.execCommand('copy'); show(ok); } catch(e){ show('No se pudo copiar'); }
    document.body.removeChild(h);
  }
  function copy(text, ok){
    if(!text){ show('Nada que copiar todavía'); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ show(ok); }, function(){ fallback(text, ok); });
    }else{ fallback(text, ok); }
  }

  document.getElementById('btnClabe').addEventListener('click', function(){ copy(digits('clabe'), '¡CLABE copiada!'); });
  document.getElementById('btnCuenta').addEventListener('click', function(){ copy(digits('cuenta'), '¡Número de cuenta copiado!'); });
})();
</script>
